name: CI/CD - Esmart Blog

on:
  push:
    branches: [main, newbranch]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. Install dependencies (root)
      - name: Install dependencies
        run: npm ci

      # 4. Install server dependencies
      - name: Install server dependencies
        run: cd server && npm ci

      # 5. Lint code (non-blocking)
      - name: Lint
        run: npm run lint || true

      # 6. Build frontend (Vue -> dist/)
      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          VUE_APP_API_BASE_URL: ${{ secrets.VUE_APP_API_BASE_URL || 'https://esmartsolutions.com.vn' }}

      # 7. Backend syntax check (NO database connection)
      - name: Backend syntax check
        run: cd server && node -c index.js

      # 8. Upload frontend build as artifact
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  deploy:
    name: Deploy Frontend (Netlify)
    runs-on: ubuntu-latest
    needs: ci

    # Deploy only on push to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Download build artifact
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # 3. Deploy to Netlify
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: ci

    # Deploy only on push to main or newbranch
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/newbranch') && github.event_name == 'push'

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: esmart-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Trigger Render deploy hook
      - name: Deploy to Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
